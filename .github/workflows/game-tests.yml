name: One Piece Frog Style regression tests

on:
  push:
    paths: ['one-piece-frog-style/**', '.github/workflows/game-tests.yml']
  pull_request:
    paths: ['one-piece-frog-style/**', '.github/workflows/game-tests.yml']

jobs:
  engine:
    name: Engine (hitboxes, mechanics, full CPU matches)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run engine regression suite (no dependencies)
        run: node one-piece-frog-style/tests/run.js

  browser:
    name: Browser (audio stutter, voices, mobile controls)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright + Chromium
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run browser regression suite
        run: node one-piece-frog-style/tests/browser.js
