name: One Piece Frog Style regression tests

on:
  push:
    paths: ['one-piece-frog-style/**', '.github/workflows/game-tests.yml']
  pull_request:
    paths: ['one-piece-frog-style/**', '.github/workflows/game-tests.yml']

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run regression suite (no dependencies)
        run: node one-piece-frog-style/tests/run.js
